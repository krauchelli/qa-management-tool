version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: qa-tool-backend-staging
    restart: unless-stopped
    ports:
      - "3001:3000" # using 3001, but 3000 is the one that is from the docker machine
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/prisma:/app/prisma
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
    command: sh -c "npx prisma generate && npm run dev"
    networks:
      - qa-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: qa-tool-frontend-staging
    restart: unless-stopped
    ports:
      - "5264:5264"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3001
      - BACKEND_URL=http://backend:3000
    depends_on:
      - backend
    networks:
      - qa-network

networks:
  qa-network:
    driver: bridge
